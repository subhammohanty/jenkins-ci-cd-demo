apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-demo-deployment
  namespace: javalearner-new
spec:
  replicas: 4
  selector:
    matchLabels:
      app: spring-boot-k8s
  template:
    metadata:
      labels:
        app: spring-boot-k8s
    spec:
      containers:
        - name: jenkins-app-container
          image: ''
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
